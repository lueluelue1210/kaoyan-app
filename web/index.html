<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>考研背诵题库</title>
<script src="data.js"></script>
<link href="https://fonts.googleapis.com/css2?family=Ma+Shan+Zheng&display=swap" rel="stylesheet">
<style>
/* ============ 卡通手绘风格基础 ============ */
:root{
  --paper:#fdf9f0;            /* 纸张底色 */
  --ink:#3b3b45;              /* 手绘墨色 */
  --ink-soft:#8a8a96;
  --card:#ffffff;
  --yellow:#ffe9a8; --pink:#ffd9d4; --mint:#cdeccd; --blue:#cfe0fb; --lav:#e2d9fb;
  --accent:#ff8f5e;           /* 橘子色主色调 */
  --green:#5cb87a; --purple:#8b7bd8; --sky:#5b9bd5;
  --radius:255px 15px 225px 15px/15px 225px 15px 255px;  /* 手绘不规则圆角 */
  --radius-s:15px 225px 15px 255px/255px 15px 225px 15px;
  --shadow:4px 4px 0 rgba(59,59,69,.14);
}
body.dark{
  --paper:#232330; --ink:#ececf2; --ink-soft:#9a9aa8; --card:#2e2e3d;
  --yellow:#5a4f2a; --pink:#5a3c38; --mint:#33502f; --blue:#2f425f; --lav:#403a5e;
  --accent:#ffa27a; --shadow:4px 4px 0 rgba(0,0,0,.4);
}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
body{
  font-family:"PingFang SC","Microsoft YaHei",system-ui,sans-serif;
  background:var(--paper); color:var(--ink);
  max-width:640px;margin:0 auto;min-height:100vh;
  padding:14px 14px 86px;transition:background .3s,color .3s;
}
.hand{font-family:"Ma Shan Zheng","PingFang SC",cursive;font-weight:400}
.view{display:none}
.view.active{display:block;animation:viewIn .3s ease}
@keyframes viewIn{from{opacity:0;transform:translateX(24px)}to{opacity:1;transform:none}}

/* ============ 手绘通用件 ============ */
.sketch{
  background:var(--card);border:2px solid var(--ink);
  border-radius:var(--radius);box-shadow:var(--shadow);
}
.sketch-s{border:2px solid var(--ink);border-radius:var(--radius-s)}
.btn{
  display:inline-flex;align-items:center;justify-content:center;gap:8px;
  border:2px solid var(--ink);background:var(--card);color:var(--ink);
  border-radius:var(--radius-s);box-shadow:3px 3px 0 rgba(59,59,69,.18);
  font-size:15px;padding:11px 18px;cursor:pointer;user-select:none;
  transition:transform .12s,box-shadow .12s;font-family:inherit;font-weight:600;
}
.btn:active{transform:translate(2px,2px);box-shadow:1px 1px 0 rgba(59,59,69,.18)}
.btn svg{width:18px;height:18px}
.btn.primary{background:var(--yellow)}
.btn.accent{background:var(--accent);color:#fff;border-color:var(--ink)}
.btn.good{background:var(--mint)}
.btn.ghost{background:transparent;box-shadow:none;border-style:dashed;color:var(--ink-soft)}
.btn:disabled{opacity:.45;cursor:default}
.btn.small{padding:7px 12px;font-size:13px}
.icon-btn{
  width:40px;height:40px;border:2px solid var(--ink);border-radius:var(--radius-s);
  background:var(--card);box-shadow:3px 3px 0 rgba(59,59,69,.18);cursor:pointer;
  display:flex;align-items:center;justify-content:center;transition:transform .12s;
}
.icon-btn:active{transform:translate(2px,2px)}
.icon-btn svg{width:19px;height:19px}
svg.ic{stroke:var(--ink);stroke-width:2;fill:none;stroke-linecap:round;stroke-linejoin:round}

/* ============ 顶栏 ============ */
.topbar{display:flex;align-items:center;justify-content:space-between;margin-bottom:14px}
.brand{display:flex;align-items:center;gap:10px}
.brand svg{width:34px;height:34px}
.brand .t{font-size:26px;line-height:1}
.topbar .sub{font-size:11px;color:var(--ink-soft);margin-top:2px}

.status-tip{border:2px dashed var(--ink-soft);border-radius:var(--radius-s);
  padding:10px 14px;font-size:13px;color:var(--ink-soft);text-align:center;margin-bottom:14px}
.status-tip.ok{border-color:var(--green);color:var(--green)}
.status-tip.err{border-color:#d66;color:#d66}

/* ============ 统计卡 ============ */
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-bottom:12px}
.stat{padding:12px 8px;text-align:center}
.stat .n{font-size:24px;font-weight:800}
.stat .l{font-size:11px;color:var(--ink-soft);margin-top:2px}
.stat.c1 .n{color:var(--accent)} .stat.c2 .n{color:var(--green)} .stat.c3 .n{color:var(--purple)}

.paper-card{padding:14px 16px;margin-bottom:14px}
.paper-title{font-size:18px;margin-bottom:10px;display:flex;align-items:center;gap:8px}
.paper-title svg{width:20px;height:20px}
.prow{display:flex;justify-content:space-between;font-size:12px;color:var(--ink-soft);margin-bottom:5px}
.track{height:10px;border:2px solid var(--ink);border-radius:99px;background:var(--card);overflow:hidden}
.fill{height:100%;background:repeating-linear-gradient(45deg,var(--accent),var(--accent) 6px,#ffab84 6px,#ffab84 12px);
  border-radius:99px;width:0;transition:width .5s ease}
.fill.green{background:repeating-linear-gradient(45deg,var(--green),var(--green) 6px,#7fd09b 6px,#7fd09b 12px)}
.fill.purple{background:repeating-linear-gradient(45deg,var(--purple),var(--purple) 6px,#a99ae6 6px,#a99ae6 12px)}

/* ============ 题库列表 ============ */
.db-item{border-top:2px dashed rgba(120,120,130,.35)}
.db-item:first-child{border-top:none}
.db-head{display:flex;align-items:center;gap:10px;padding:11px 6px;cursor:pointer;user-select:none}
.db-head .arrow{transition:transform .2s;color:var(--ink-soft);flex:none}
.db-head .arrow.open{transform:rotate(90deg)}
.db-head strong{flex:1;font-size:15px}
.cnt{font-size:11px;border:1.5px solid var(--ink);border-radius:99px;padding:2px 9px;background:var(--blue);flex:none}
.chapter-wrap{display:none;padding:2px 4px 12px 30px;flex-wrap:wrap;gap:8px}
.chapter-wrap.open{display:flex}
.ch-item{display:inline-flex;align-items:center;gap:6px;padding:5px 12px;font-size:13px;
  border:2px solid var(--ink-soft);border-radius:99px;cursor:pointer;color:var(--ink-soft);
  background:var(--card);transition:all .15s;user-select:none}
.ch-item .mini{font-size:11px}
.ch-item .mini b{color:var(--green);font-weight:700}
.ch-item.on{border-color:var(--ink);color:var(--ink);background:var(--yellow);box-shadow:2px 2px 0 rgba(59,59,69,.15)}
.ch-item:hover{border-color:var(--ink);color:var(--ink)}
input[type=checkbox]{accent-color:var(--accent);width:16px;height:16px;cursor:pointer;flex:none}

/* ============ 筛选 chips ============ */
.chips{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin-bottom:12px}
.chip{padding:6px 14px;font-size:13px;border:2px solid var(--ink-soft);border-radius:99px;
  cursor:pointer;color:var(--ink-soft);background:var(--card);user-select:none;transition:all .15s}
.chip.on{border-color:var(--ink);color:var(--ink);background:var(--lav);box-shadow:2px 2px 0 rgba(59,59,69,.15);font-weight:600}
.switch{display:flex;align-items:center;gap:7px;font-size:13px;color:var(--ink-soft);cursor:pointer;user-select:none}
.switch input{accent-color:var(--green);width:16px;height:16px}
.row-flex{display:flex;gap:10px;flex-wrap:wrap;margin-bottom:14px}

/* ============ 背诵页 ============ */
.study-top{display:flex;align-items:center;gap:10px;margin-bottom:10px}
.study-top .scope{flex:1;font-size:20px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.counter{flex:none;font-size:13px;border:2px solid var(--ink);border-radius:99px;
  padding:4px 12px;background:var(--mint);font-weight:700}
.counter.done-all{background:var(--yellow)}
.mode-tabs{display:flex;gap:8px;margin-bottom:10px}
.finish-banner{display:none;border:2px solid var(--ink);border-radius:var(--radius-s);
  background:var(--yellow);padding:10px 14px;font-size:14px;margin-bottom:12px;
  box-shadow:3px 3px 0 rgba(59,59,69,.15)}
.finish-banner.show{display:block;animation:pop .3s ease}
@keyframes pop{from{opacity:0;transform:scale(.94)}to{opacity:1;transform:none}}

.q-tags{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:12px}
.qtag{font-size:12px;padding:3px 11px;border-radius:99px;border:1.5px solid var(--ink);font-weight:600}
.qtag.t{background:var(--blue)} .qtag.d{background:var(--lav)} .qtag.c{background:var(--card);border-style:dashed;font-weight:400;color:var(--ink-soft)}
.qtag.done{background:var(--mint)}
.q-title{font-size:19px;font-weight:700;line-height:1.65;margin-bottom:10px}
.q-stat{font-size:12px;color:var(--ink-soft);margin-bottom:12px}
.answer{max-height:0;overflow:hidden;transition:max-height .45s ease,margin .3s}
.answer.show{max-height:6000px;margin-bottom:14px}
.answer-inner{background:var(--paper);border:2px dashed var(--ink-soft);border-radius:var(--radius-s);
  padding:14px;white-space:pre-line;font-size:15px;line-height:1.85}
.q-btns{display:flex;gap:10px;flex-wrap:wrap}
.q-btns .btn{flex:1}

/* ============ 进度页 ============ */
.p-db{margin-bottom:14px;padding:12px 14px}
.p-db .h{display:flex;align-items:center;gap:8px;margin-bottom:8px}
.p-db .h strong{flex:1;font-size:16px}
.p-db .pct{font-size:13px;font-weight:700;color:var(--accent)}
.p-ch{display:flex;align-items:center;gap:7px;padding:6px 0;border-top:1.5px dashed rgba(120,120,130,.3)}
.p-ch:first-of-type{border-top:none;margin-top:4px}
.p-ch .nm{flex:1;font-size:13px;color:var(--ink-soft);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.p-ch .track{width:30%;flex:none}
.p-ch .pc{font-size:11px;color:var(--ink-soft);width:46px;text-align:right;flex:none}
.p-ch .pc b{color:var(--green)}

/* 单条清零小按钮 */
.mini-reset{
  flex:none;width:26px;height:26px;padding:0;
  border:1.5px solid var(--ink-soft);border-radius:50%;
  background:var(--card);color:var(--ink-soft);
  font-size:13px;line-height:1;font-family:inherit;
  display:flex;align-items:center;justify-content:center;
  cursor:pointer;transition:all .15s;
}
.mini-reset:hover{border-color:var(--accent);color:var(--accent);background:var(--paper)}
.mini-reset:active{transform:translate(1px,1px)}
.mini-reset:disabled{opacity:.3;cursor:default}

.big-empty{text-align:center;padding:40px 0;color:var(--ink-soft)}
.big-empty svg{width:72px;height:72px;margin-bottom:12px;opacity:.6}
.big-empty .hand{font-size:22px;margin-bottom:6px}

/* ============ 底部导航 ============ */
.tabbar{
  position:fixed;bottom:12px;left:50%;transform:translateX(-50%);
  width:min(420px,calc(100% - 28px));
  display:flex;gap:8px;padding:8px;z-index:50;
  background:var(--card);border:2px solid var(--ink);border-radius:22px;
  box-shadow:var(--shadow);
}
.tab{flex:1;display:flex;flex-direction:column;align-items:center;gap:3px;
  padding:8px 0;border-radius:16px;cursor:pointer;color:var(--ink-soft);font-size:12px;user-select:none}
.tab svg{width:21px;height:21px}
.tab.active{background:var(--yellow);color:var(--ink);border:2px solid var(--ink)}
.tab:nth-child(2).active{background:var(--mint)}

@media(max-width:400px){.stats{grid-template-columns:1fr 1fr}.stats .stat:last-child{grid-column:1/-1}}
/* ============ 浏览/搜索页 ============ */
.search-bar{margin-bottom:12px}
.search-bar input{
  width:100%;padding:12px 16px;font-size:15px;font-family:inherit;
  color:var(--ink);background:var(--card);
  border:2px solid var(--ink);border-radius:var(--radius-s);
  box-shadow:3px 3px 0 rgba(59,59,69,.12);outline:none;
}
.search-bar input:focus{background:var(--paper)}
.browse-q{padding:12px 14px;margin-bottom:12px}
.browse-title{font-size:15px;font-weight:700;line-height:1.6;margin:8px 0}
.browse-answer{
  max-height:0;overflow:hidden;transition:max-height .35s ease,margin .3s;
  white-space:pre-line;font-size:14px;line-height:1.8;color:var(--ink-soft);
}
.browse-answer.show{
  max-height:8000px;margin-bottom:10px;padding:12px;
  background:var(--paper);border:1.5px dashed var(--ink-soft);
  border-radius:var(--radius-s);color:var(--ink);
}
.browse-toggle{margin-top:4px}
</style>
<base target="_blank">
</head>
<body>

<!-- ==================== 首页 ==================== -->
<div class="view active" id="view-home">
  <div class="topbar">
    <div class="brand">
      <svg viewBox="0 0 24 24" class="ic"><path d="M4 5c3-1.5 6-1.5 8 0 2-1.5 5-1.5 8 0v13c-3-1.5-6-1.5-8 0-2-1.5-5-1.5-8 0z"/><path d="M12 5v13"/></svg>
      <div><div class="t hand">考研背诵</div><div class="sub">哲学  ·  一站式刷题</div></div>
    </div>
    <button class="icon-btn" id="btnTheme" title="切换主题">
      <svg viewBox="0 0 24 24" class="ic" id="themeIcon"><circle cx="12" cy="12" r="4.5"/><path d="M12 2.5v2.5M12 19v2.5M2.5 12H5M19 12h2.5M4.9 4.9l1.8 1.8M17.3 17.3l1.8 1.8M4.9 19.1l1.8-1.8M17.3 6.7l1.8-1.8"/></svg>
    </button>
  </div>

  <div class="status-tip" id="statusTip">正在翻书加载题库，请稍候……</div>

  <div id="homeMain" style="display:none">
    <div class="stats">
      <div class="stat c1 sketch sketch-s"><div class="n" id="ovTotal">0</div><div class="l">已选题目</div></div>
      <div class="stat c2 sketch sketch-s"><div class="n" id="ovDone">0</div><div class="l">已背完</div></div>
      <div class="stat c3 sketch sketch-s"><div class="n" id="ovLeft">0</div><div class="l">待背诵</div></div>
    </div>

    <div class="paper-card sketch">
      <div class="paper-title hand">
        <svg viewBox="0 0 24 24" class="ic"><path d="M3 20h18M6 20V10M11 20V4M16 20v-9M21 20v-5"/></svg>
        今日背诵进度
      </div>
      <div class="prow"><span id="ovBarLabel">尚未选择题库章节</span><span id="ovPct">0%</span></div>
      <div class="track"><div class="fill" id="ovFill"></div></div>
    </div>

    <div class="paper-card sketch" style="padding:8px 14px 14px">
      <div class="paper-title hand">
        <svg viewBox="0 0 24 24" class="ic"><path d="M4 5c3-1.5 6-1.5 8 0 2-1.5 5-1.5 8 0v13c-3-1.5-6-1.5-8 0-2-1.5-5-1.5-8 0z"/><path d="M12 5v13"/></svg>
        选择题库与章节
      </div>
      <div id="dbList"></div>
    </div>

    <div class="chips" id="typeFilter"><span style="font-size:13px;color:var(--ink-soft)">题型</span></div>
    <div class="row-flex">
      <label class="switch"><input type="checkbox" id="chkUnreviewed"> 优先抽未背完的题</label>
      <label class="switch"><input type="checkbox" id="chkSkipDone"> 顺序模式跳过已背完</label>
    </div>

    <div class="row-flex">
      <button class="btn accent" id="btnStartRandom" style="flex:1">
        <svg viewBox="0 0 24 24" class="ic"><path d="M3 7h4l10 10h4M3 17h4l2.5-2.5M13.5 9.5 17 7h4"/><path d="M18 4l3 3-3 3M18 14l3 3-3 3"/></svg>
        随机背诵
      </button>
      <button class="btn primary" id="btnStartOrder" style="flex:1">
        <svg viewBox="0 0 24 24" class="ic"><path d="M9 6h11M9 12h11M9 18h11"/><circle cx="4.5" cy="6" r="1.4"/><circle cx="4.5" cy="12" r="1.4"/><circle cx="4.5" cy="18" r="1.4"/></svg>
        顺序背诵
      </button>
    </div>
  </div>
</div>

<!-- ==================== 背诵页 ==================== -->
<div class="view" id="view-study">
  <div class="study-top">
    <button class="icon-btn" id="btnBackHome">
      <svg viewBox="0 0 24 24" class="ic"><path d="M15 5l-7 7 7 7"/></svg>
    </button>
    <div class="scope hand" id="studyScope">背诵中</div>
    <div class="counter" id="studyCounter">0/0</div>
  </div>

  <div class="mode-tabs">
    <span class="chip on" id="tabRandom">随机抽题</span>
    <span class="chip" id="tabOrder">顺序刷题</span>
  </div>

  <div class="track" style="margin-bottom:12px"><div class="fill green" id="studyFill"></div></div>

  <div class="finish-banner" id="finishBanner">
    <span class="hand" style="font-size:17px">太棒了，这个范围全部背完啦！</span>
    <div style="font-size:12px;color:var(--ink-soft);margin-top:2px">可以回到首页换一批章节，或继续随机复习巩固</div>
  </div>

  <div class="paper-card sketch" id="studyCard">
    <div class="q-tags" id="qTags"></div>
    <div class="q-title" id="qTitle"></div>
    <div class="q-stat" id="qStat"></div>
    <div class="answer" id="answerWrap"><div class="answer-inner" id="qAnswer"></div></div>
    <div class="q-btns">
      <button class="btn primary" id="btnToggleAnswer">
        <svg viewBox="0 0 24 24" class="ic"><path d="M2.5 12s3.5-6.5 9.5-6.5S21.5 12 21.5 12 18 18.5 12 18.5 2.5 12 2.5 12z"/><circle cx="12" cy="12" r="2.8"/></svg>
        <span id="toggleAnswerLabel">看答案</span>
      </button>
      <button class="btn good" id="btnMarkReview">
        <svg viewBox="0 0 24 24" class="ic"><path d="M4.5 12.5l5 5 10-11"/></svg>
        <span id="markReviewLabel">记住了</span>
      </button>
    </div>
  </div>

  <button class="btn accent" id="btnNext" style="width:100%;margin-top:14px;padding:14px;font-size:16px">
    <svg viewBox="0 0 24 24" class="ic"><path d="M5 12h13M13 6l6 6-6 6"/></svg>
    下一题
  </button>
  <div style="text-align:center;font-size:12px;color:var(--ink-soft);margin-top:10px">
    今天也要努力从吃汉堡哦
  </div>
</div>

<!-- ==================== 进度页 ==================== -->
<div class="view" id="view-progress">
  <div class="topbar">
    <div class="brand">
      <svg viewBox="0 0 24 24" class="ic"><path d="M3 20h18M6 20V10M11 20V4M16 20v-9M21 20v-5"/></svg>
      <div><div class="t hand">背诵进度</div><div class="sub">每个章节，了如指掌</div></div>
    </div>
  </div>

  <div class="paper-card sketch" style="margin-bottom:14px">
    <div class="paper-title hand">
      <svg viewBox="0 0 24 24" class="ic"><circle cx="12" cy="12" r="8.5"/><path d="M12 7v5l3.5 2"/></svg>
      总进度
    </div>
    <div class="prow"><span id="pgTotalLabel">全部题库</span><span id="pgTotalPct">0%</span></div>
    <div class="track"><div class="fill purple" id="pgTotalFill"></div></div>
    <div style="display:flex;gap:16px;margin-top:10px;font-size:13px;color:var(--ink-soft)">
      <span>已背 <b id="pgDone" style="color:var(--green)">0</b></span>
      <span>待背 <b id="pgLeft" style="color:var(--purple)">0</b></span>
      <span>共 <b id="pgAll">0</b> 题</span>
    </div>
  </div>

  <div id="pgList"></div>

  <button class="btn ghost" id="btnReset" style="width:100%;margin-top:6px">
    <svg viewBox="0 0 24 24" class="ic"><path d="M4.5 6.5h15l-1.3 13h-12.4zM9 6.5V5a2 2 0 0 1 2-2h2a2 2 0 0 1 2 2v1.5M10 10.5v6M14 10.5v6"/></svg>
    清空全部背诵记录
  </button>
</div>

<!-- ==================== 浏览页 ==================== -->
<div class="view" id="view-browse">
  <div class="topbar">
    <div class="brand">
      <svg viewBox="0 0 24 24" class="ic"><path d="M4 6h16M4 12h16M4 18h10"/></svg>
      <div><div class="t hand">浏览题库</div><div class="sub">按章节查看全部题目与答案</div></div>
    </div>
  </div>

  <div class="chips" id="browseDbChips"><span style="font-size:13px;color:var(--ink-soft)">题库</span></div>
  <div class="chips" id="browseChChips"><span style="font-size:13px;color:var(--ink-soft)">章节</span></div>

  <div id="browseList"></div>
</div>

<!-- ==================== 搜索页 ==================== -->
<div class="view" id="view-search">
  <div class="topbar">
    <div class="brand">
      <svg viewBox="0 0 24 24" class="ic"><circle cx="11" cy="11" r="6.5"/><path d="M20 20l-4-4"/></svg>
      <div><div class="t hand">搜索题目</div><div class="sub">匹配题干和答案中的关键词</div></div>
    </div>
  </div>

  <div class="search-bar">
    <input type="text" id="searchInput" placeholder="输入关键词，例如：亚里士多德、实践、自由…">
  </div>

  <div class="chips" id="searchScopeChips"></div>

  <div id="searchResults"></div>
</div>

<!-- ==================== 底部导航 ==================== -->
<nav class="tabbar" id="tabbar">
  <div class="tab active" data-view="home">
    <svg viewBox="0 0 24 24" class="ic"><path d="M4 11l8-7 8 7M6 9.5V20h12V9.5"/></svg>
    首页
  </div>
  <div class="tab" data-view="browse">
    <svg viewBox="0 0 24 24" class="ic"><path d="M4 6h16M4 12h16M4 18h10"/></svg>
    浏览
  </div>
  <div class="tab" data-view="search">
    <svg viewBox="0 0 24 24" class="ic"><circle cx="11" cy="11" r="6.5"/><path d="M20 20l-4-4"/></svg>
    搜索
  </div>
  <div class="tab" data-view="progress">
    <svg viewBox="0 0 24 24" class="ic"><path d="M3 20h18M6 20V10M11 20V4M16 20v-9M21 20v-5"/></svg>
    进度
  </div>
</nav>

<script>
/* ================= 配置 ================= */
const DB_LIST = [
  {dbId:"db0", name:"真题外补充题库",   file:"真题外补充题库.csv"},
  {dbId:"db1", name:"西哲背诵题库",     file:"西哲背诵题库.csv"},
  {dbId:"db2", name:"西哲论述题",       file:"西哲论述题.csv"},
  {dbId:"db3", name:"马哲原理背诵题库", file:"马哲原理背诵题库.csv"},
  {dbId:"db4", name:"马哲原理论述题",   file:"马哲原理论述题.csv"},
  {dbId:"db5", name:"预测复习大纲",     file:"预测复习大纲.csv"}
];
const STORAGE_KEY = "tiku_record_v2";
const THEME_KEY = "tiku_theme";
const $ = id => document.getElementById(id);

/* ================= 状态 ================= */
const dbData = {};
const selectedMap = {};
let selectedTypes = new Set();
let onlyUnreviewed = false, skipDoneInOrder = false;
let currentQuestion = null;
let session = null;   // {pool, mode, index, scopeName}

/* ================= 记录 ================= */
function loadRecord(){ try{ return JSON.parse(localStorage.getItem(STORAGE_KEY))||{} }catch(e){ return {} } }
function saveRecord(r){ localStorage.setItem(STORAGE_KEY, JSON.stringify(r)) }

/* ================= 主题 ================= */
(function(){
  const dark = localStorage.getItem(THEME_KEY)==="dark" ||
    (!localStorage.getItem(THEME_KEY) && matchMedia("(prefers-color-scheme: dark)").matches);
  if(dark) document.body.classList.add("dark");
})();
$("btnTheme").onclick = () => {
  const dark = document.body.classList.toggle("dark");
  localStorage.setItem(THEME_KEY, dark?"dark":"light");
};

/* ================= 页面切换 ================= */
function showView(name){
  document.querySelectorAll(".view").forEach(v=>v.classList.remove("active"));
  $("view-"+name).classList.add("active");
  document.querySelectorAll(".tab").forEach(t=>
    t.classList.toggle("active", t.dataset.view===name));
  window.scrollTo({top:0});
}
document.querySelectorAll(".tab").forEach(t=>{
  t.onclick = ()=> showView(t.dataset.view);
});
$("btnBackHome").onclick = ()=> showView("home");

/* ================= 加载题库 ================= */
function loadOneDb(item){
  const data = window.DB_DATA && window.DB_DATA[item.dbId];
  if(!data) throw new Error('缺少数据：' + item.name);
  const records = loadRecord();
  const qs=[], chapSet=new Set(), typeSet=new Set();
  for(const row of data.rows){
    const ch=(row["章节"]||"").trim(), tp=(row["题型"]||"").trim();
    const title=(row["题干"]||"").trim(), ans=(row["标准答案"]||"").trim();
    if(!title) continue;
    const qKey = `${item.dbId}||${ch}||${tp}||${title}`;
    if(!records[qKey]) records[qKey]={draw:0,review:0};
    qs.push({dbId:item.dbId, chapter:ch, type:tp, title, answer:ans,
             qKey, draw:records[qKey].draw, review:records[qKey].review});
    if(ch) chapSet.add(ch);
    if(tp) typeSet.add(tp);
  }
  saveRecord(records);
  dbData[item.dbId]={name:item.name, questions:qs,
                     chapters:Array.from(chapSet), typeSet};
  selectedMap[item.dbId]=new Set();
}
async function loadAllDb(){
  try{
    for(const item of DB_LIST){ $("statusTip").textContent=`正在翻书加载：${item.name}`; await loadOneDb(item); }
    $("statusTip").textContent="今天也要好好背书和吃汉堡包哦，还有要好好喝水和睡觉！";
    $("statusTip").className="status-tip ok";
    $("homeMain").style.display="block";
    renderDbUi(); renderTypeFilter(); refreshAll();
  }catch(err){
    $("statusTip").textContent="题库加载出错，请检查 CSV 文件名是否完全一致";
    $("statusTip").className="status-tip err";
    console.error(err);
  }
}

/* ================= 首页渲染 ================= */
function renderDbUi(){
  const wrap=$("dbList"); wrap.innerHTML="";
  DB_LIST.forEach(item=>{
    const d=dbData[item.dbId];
    const div=document.createElement("div"); div.className="db-item";
    div.innerHTML=`
      <div class="db-head">
        <input type="checkbox" class="db-checkbox" data-dbid="${item.dbId}">
        <span class="arrow" data-dbid="${item.dbId}">▶</span>
        <strong>${d.name}</strong>
        <span class="cnt">已背 ${d.questions.filter(q=>q.review>0).length}/${d.questions.length}</span>
      </div>
      <div class="chapter-wrap" data-dbid="${item.dbId}"></div>`;
    const cw=div.querySelector(".chapter-wrap");
    d.chapters.forEach(ch=>{
      const list=d.questions.filter(q=>q.chapter===ch);
      const done=list.filter(q=>q.review>0).length;
      const el=document.createElement("span");
      el.className="ch-item"; el.dataset.dbid=item.dbId; el.dataset.ch=ch;
      el.innerHTML=`${ch} <span class="mini"><b>${done}</b>/${list.length}</span>`;
      cw.appendChild(el);
    });
    wrap.appendChild(div);
  });
  bindDbEvents();
}
function bindDbEvents(){
  document.querySelectorAll(".db-head").forEach(head=>{
    head.addEventListener("click",e=>{
      if(e.target.type==="checkbox") return;
      const dbid=head.querySelector(".arrow").dataset.dbid;
      document.querySelector(`.chapter-wrap[data-dbid="${dbid}"]`).classList.toggle("open");
      head.querySelector(".arrow").classList.toggle("open");
    });
  });
  document.querySelectorAll(".db-checkbox").forEach(el=>{
    el.onchange=()=>{
      const dbid=el.dataset.dbid;
      selectedMap[dbid] = el.checked ? new Set(dbData[dbid].chapters) : new Set();
      refreshAll();
    };
  });
  document.querySelectorAll(".ch-item").forEach(el=>{
    el.onclick=()=>{
      const {dbid,ch}=el.dataset, sel=selectedMap[dbid];
      sel.has(ch)?sel.delete(ch):sel.add(ch);
      document.querySelector(`.db-checkbox[data-dbid="${dbid}"]`).checked =
        dbData[dbid].chapters.every(c=>sel.has(c));
      refreshAll();
    };
  });
}
function renderTypeFilter(){
  const all=new Set();
  DB_LIST.forEach(i=>dbData[i.dbId].typeSet.forEach(t=>all.add(t)));
  const wrap=$("typeFilter");
  all.forEach(t=>{
    const c=document.createElement("span");
    c.className="chip on"; c.textContent=t;
    selectedTypes.add(t);
    c.onclick=()=>{
      selectedTypes.has(t)?selectedTypes.delete(t):selectedTypes.add(t);
      c.classList.toggle("on"); refreshAll();
    };
    wrap.appendChild(c);
  });
}
$("chkUnreviewed").onchange=e=>onlyUnreviewed=e.target.checked;
$("chkSkipDone").onchange =e=>skipDoneInOrder =e.target.checked;

/* ================= 筛选与统计 ================= */
function getFilteredQuestionPool(){
  let out=[];
  for(const item of DB_LIST){
    const sel=selectedMap[item.dbId];
    out=out.concat(dbData[item.dbId].questions.filter(
      q=>sel.has(q.chapter)&&selectedTypes.has(q.type)));
  }
  return out;
}
function refreshAll(){ refreshHomeStats(); refreshDbCounts(); }
function refreshHomeStats(){
  const pool=getFilteredQuestionPool();
  const done=pool.filter(q=>q.review>0).length;
  $("ovTotal").textContent=pool.length;
  $("ovDone").textContent=done;
  $("ovLeft").textContent=pool.length-done;
  const pct=pool.length?Math.round(done/pool.length*100):0;
  $("ovPct").textContent=pct+"%";
  $("ovFill").style.width=pct+"%";
  const names=DB_LIST.filter(i=>selectedMap[i.dbId].size>0).map(i=>i.name);
  $("ovBarLabel").textContent = names.length ? "当前范围："+names.join("、") : "尚未选择题库章节";
}
function refreshDbCounts(){
  document.querySelectorAll(".ch-item").forEach(el=>{
    const d=dbData[el.dataset.dbid];
    const list=d.questions.filter(q=>q.chapter===el.dataset.ch);
    const done=list.filter(q=>q.review>0).length;
    el.querySelector(".mini").innerHTML=`<b>${done}</b>/${list.length}`;
    el.classList.toggle("on", selectedMap[el.dataset.dbid].has(el.dataset.ch));
  });
  DB_LIST.forEach(item=>{
    const d=dbData[item.dbId];
    const head=document.querySelector(`.db-head:has([data-dbid="${item.dbId}"])`);
    if(head) head.querySelector(".cnt").textContent=
      `已背 ${d.questions.filter(q=>q.review>0).length}/${d.questions.length}`;
  });
}

/* ================= 背诵页 ================= */
function getScopeName(){
  const names=DB_LIST.filter(i=>selectedMap[i.dbId].size>0).map(i=>i.name);
  return names.length?names.join(" · "):"背诵";
}
function startSession(mode){
  const pool=getFilteredQuestionPool();
  if(!pool.length){ alert("请先在首页勾选至少一个章节和题型"); return; }
  session={pool, mode, index:0, scopeName:getScopeName()};
  $("studyScope").textContent=session.scopeName;
  setModeTabs(mode);
  showView("study");
  nextQuestion(true);
}
function setModeTabs(mode){
  $("tabRandom").classList.toggle("on", mode==="random");
  $("tabOrder").classList.toggle("on", mode==="order");
}
$("tabRandom").onclick=()=>{ if(session){session.mode="random"; setModeTabs("random");} };
$("tabOrder").onclick =()=>{ if(session){session.mode="order"; setModeTabs("order"); nextQuestion();} };

function nextQuestion(first=false){
  if(!session) return;
  let pool=session.pool;
  if(session.mode==="order"){
    if(skipDoneInOrder){
      const rest=pool.filter(q=>q.review===0);
      if(!rest.length){
        showFinishBanner(true);
        if(first) showQ(pool[0]);
        return;
      }
      showFinishBanner(false);
      showQ(rest[0]);
      return;
    }
    if(session.index>=pool.length){
      session.index=0;
      showFinishBanner(pool.every(q=>q.review>0));
      showQ(pool[0]); session.index=1; return;
    }
    showFinishBanner(pool.every(q=>q.review>0));
    showQ(pool[session.index++]);
  }else{
    let cand=pool;
    if(onlyUnreviewed||skipDoneInOrder){
      const rest=pool.filter(q=>q.review===0);
      if(rest.length) cand=rest;
      else if(!first) showFinishBanner(true);
    }
    showFinishBanner(pool.every(q=>q.review>0));
    showQ(cand[Math.floor(Math.random()*cand.length)]);
  }
}
function showFinishBanner(show){ $("finishBanner").classList.toggle("show",show); }

function showQ(q){
  currentQuestion=q;
  const rec=loadRecord();
  rec[q.qKey].draw+=1; q.draw=rec[q.qKey].draw; saveRecord(rec);

  const dbInfo=DB_LIST.find(x=>x.dbId===q.dbId);
  $("qTags").innerHTML=
    `<span class="qtag t">${q.type}</span>
     <span class="qtag d">${dbInfo.name}</span>
     <span class="qtag c">${q.chapter}</span>`;
  $("qTitle").textContent=q.title;
  $("qAnswer").textContent=q.answer;
  $("answerWrap").classList.remove("show");
  $("toggleAnswerLabel").textContent="看答案";
  updateReviewUi();
  updateStudyProgress();
  const card=$("studyCard");
  card.style.animation="none"; void card.offsetWidth;
  card.style.animation="pop .3s ease";
}

/* 刷新“已背/取消”相关 UI */
function updateReviewUi(){
  const q=currentQuestion; if(!q) return;
  $("qStat").textContent=`抽到 ${q.draw} 次 ｜ 背诵 ${q.review} 次`;

  let tag=$("qTags").querySelector(".qtag.done");
  if(q.review>0){
    if(tag) tag.textContent=`已背 ${q.review} 次`;
    else $("qTags").insertAdjacentHTML("beforeend",`<span class="qtag done">已背 ${q.review} 次</span>`);
  }else if(tag){
    tag.remove();
  }
  $("markReviewLabel").textContent = q.review>0 ? "取消标记" : "记住了";
}

function updateStudyProgress(){
  if(!session) return;
  const done=session.pool.filter(q=>q.review>0).length, total=session.pool.length;
  $("studyCounter").textContent=`${done}/${total}`;
  $("studyCounter").classList.toggle("done-all", done===total&&total>0);
  $("studyFill").style.width=(total?done/total*100:0)+"%";
  $("finishBanner").classList.toggle("show", total>0&&done===total);
}

$("btnStartRandom").onclick=()=>startSession("random");
$("btnStartOrder").onclick =()=>startSession("order");
$("btnNext").onclick=()=>nextQuestion();

$("btnToggleAnswer").onclick=()=>{
  const show=$("answerWrap").classList.toggle("show");
  $("toggleAnswerLabel").textContent = show?"收起来":"看答案";
};

/* 记住 / 取消记住 双向切换 */
$("btnMarkReview").onclick=()=>{
  if(!currentQuestion) return;
  const rec=loadRecord();
  const key=currentQuestion.qKey;
  if(!rec[key]) rec[key]={draw:0,review:0};

  if(rec[key].review>0){
    rec[key].review=0;          // 取消标记
  }else{
    rec[key].review+=1;         // 标记已背
  }
  currentQuestion.review=rec[key].review;
  saveRecord(rec);
  updateReviewUi();
  updateStudyProgress();
  refreshAll();
};

/* ================= 进度页 ================= */
function renderProgress(){
  let allQ=[], doneAll=0;
  const list=$("pgList"); list.innerHTML="";
  DB_LIST.forEach(item=>{
    const d=dbData[item.dbId];
    const done=d.questions.filter(q=>q.review>0).length;
    allQ=allQ.concat(d.questions); doneAll+=done;
    const pct=d.questions.length?Math.round(done/d.questions.length*100):0;
    const sec=document.createElement("div");
    sec.className="p-db sketch";
    sec.innerHTML=`
      <div class="h">
        <strong class="hand" style="font-size:17px">${d.name}</strong>
        <span class="pct">${pct}%</span>
        <button class="mini-reset" data-dbid="${item.dbId}" data-ch="" title="清零本题库进度">↺</button>
      </div>
      <div class="track" style="margin-bottom:4px"><div class="fill purple" style="width:${pct}%"></div></div>`;
    d.chapters.forEach(ch=>{
      const qs=d.questions.filter(q=>q.chapter===ch);
      const dn=qs.filter(q=>q.review>0).length;
      const pc=qs.length?Math.round(dn/qs.length*100):0;
      const row=document.createElement("div"); row.className="p-ch";
      row.innerHTML=`<span class="nm">${ch}</span>
        <div class="track"><div class="fill ${pc===100?'green':''}" style="width:${pc}%"></div></div>
        <span class="pc"><b>${dn}</b>/${qs.length}</span>
        <button class="mini-reset" data-dbid="${item.dbId}" data-ch="${ch.replace(/"/g,'&quot;')}" title="清零本章进度">↺</button>`;
      sec.appendChild(row);
    });
    list.appendChild(sec);
  });
  const total=allQ.length;
  $("pgAll").textContent=total;
  $("pgDone").textContent=doneAll;
  $("pgLeft").textContent=total-doneAll;
  const pct=total?Math.round(doneAll/total*100):0;
  $("pgTotalPct").textContent=pct+"%";
  $("pgTotalFill").style.width=pct+"%";
  $("pgTotalLabel").textContent=`全部题库（${DB_LIST.length} 套）`;
}

/* 单条进度清零：dbId + chapter（章节为空则整个题库） */
function resetProgress(dbId, chapter){
  const d=dbData[dbId]; if(!d) return;
  const targets = chapter ? d.questions.filter(q=>q.chapter===chapter) : d.questions;
  if(!targets.length) return;

  const rec=loadRecord();
  targets.forEach(q=>{
    if(!rec[q.qKey]) rec[q.qKey]={draw:0,review:0};
    rec[q.qKey].review = 0;   // 只清背诵进度，保留抽题次数
    q.review = 0;
  });
  saveRecord(rec);

  refreshAll();          // 首页统计 + 章节计数
  renderProgress();      // 进度页重绘
  if(session) updateStudyProgress();
  if(currentQuestion && targets.indexOf(currentQuestion) > -1) updateReviewUi();
}

/* 事件委托：进度页的清零按钮 */
$("pgList").addEventListener("click", e=>{
  const btn = e.target.closest(".mini-reset");
  if(!btn) return;
  const dbId = btn.dataset.dbid;
  const ch   = btn.dataset.ch || "";
  const dbName = (DB_LIST.find(x=>x.dbId===dbId)||{}).name || "该题库";
  const label = ch ? `「${dbName}」→「${ch}」` : `「${dbName}」整个题库`;
  if(!confirm(`确定把 ${label} 的背诵进度清零吗？`)) return;
  resetProgress(dbId, ch);
});

document.querySelector('.tab[data-view="progress"]').addEventListener("click", renderProgress);

/* 全部清空 */
$("btnReset").onclick=()=>{
  if(!confirm("确定清空所有背诵记录吗？此操作不可恢复！")) return;
  localStorage.removeItem(STORAGE_KEY);
  DB_LIST.forEach(i=>dbData[i.dbId].questions.forEach(q=>{q.draw=0;q.review=0;}));
  refreshAll(); renderProgress(); updateStudyProgress();
  if(currentQuestion){
    currentQuestion.draw=0; currentQuestion.review=0;
    updateReviewUi();
  }
  alert("背诵记录已清空，重新开始吧");
};

/* ================= 快捷键 ================= */
document.addEventListener("keydown",e=>{
  if(e.target.tagName==="INPUT"||e.target.tagName==="TEXTAREA") return;
  if(!$("view-study").classList.contains("active")) return;
  if(e.code==="Space"){ e.preventDefault(); $("btnToggleAnswer").click(); }
  else if(e.key==="Enter"){ e.preventDefault(); nextQuestion(); }
});

/* ================= 浏览页 ================= */
let browseDbId = null;
let browseChapter = null;

function renderBrowse(){
  // 题库 chips
  const dbChips = $("browseDbChips");
  dbChips.innerHTML = '<span style="font-size:13px;color:var(--ink-soft)">题库</span>';
  DB_LIST.forEach(item => {
    const chip = document.createElement("span");
    chip.className = "chip" + (browseDbId === item.dbId ? " on" : "");
    chip.textContent = item.name;
    chip.onclick = () => {
      browseDbId = item.dbId;
      browseChapter = null;
      renderBrowse();
    };
    dbChips.appendChild(chip);
  });

  // 默认选题库
  if (!browseDbId && DB_LIST.length) browseDbId = DB_LIST[0].dbId;

  // 章节 chips
  const chChips = $("browseChChips");
  chChips.innerHTML = '<span style="font-size:13px;color:var(--ink-soft)">章节</span>';
  const db = dbData[browseDbId];
  if (db) {
    db.chapters.forEach(ch => {
      const chip = document.createElement("span");
      chip.className = "chip" + (browseChapter === ch ? " on" : "");
      chip.textContent = ch;
      chip.onclick = () => {
        browseChapter = (browseChapter === ch) ? null : ch;
        renderBrowse();
      };
      chChips.appendChild(chip);
    });
  }

  // 题目列表
  const list = $("browseList");
  list.innerHTML = "";
  if (!db) return;

  let qs = db.questions;
  if (browseChapter) qs = qs.filter(q => q.chapter === browseChapter);

  if (!qs.length) {
    list.innerHTML = '<div class="big-empty"><div class="hand">这里还没有题目</div></div>';
    return;
  }

  qs.forEach((q, idx) => {
    const card = document.createElement("div");
    card.className = "paper-card sketch browse-q";
    card.innerHTML = `
      <div class="q-tags">
        <span class="qtag t">${q.type}</span>
        <span class="qtag c">${q.chapter}</span>
        ${q.review > 0 ? '<span class="qtag done">已背 ' + q.review + ' 次</span>' : ''}
      </div>
      <div class="browse-title">${idx + 1}. ${q.title}</div>
      <div class="browse-answer">${q.answer}</div>
      <button class="btn small primary browse-toggle">展开答案</button>
    `;
    const answerEl = card.querySelector(".browse-answer");
    const btn = card.querySelector(".browse-toggle");
    btn.onclick = () => {
      const show = answerEl.classList.toggle("show");
      btn.textContent = show ? "收起答案" : "展开答案";
    };
    list.appendChild(card);
  });
}

/* ================= 搜索页 ================= */
let searchScope = "all";

function renderSearchScope(){
  const wrap = $("searchScopeChips");
  wrap.innerHTML = '<span style="font-size:13px;color:var(--ink-soft)">范围</span>';

  const allChip = document.createElement("span");
  allChip.className = "chip" + (searchScope === "all" ? " on" : "");
  allChip.textContent = "全部题库";
  allChip.onclick = () => { searchScope = "all"; renderSearchScope(); doSearch(); };
  wrap.appendChild(allChip);

  DB_LIST.forEach(item => {
    const chip = document.createElement("span");
    chip.className = "chip" + (searchScope === item.dbId ? " on" : "");
    chip.textContent = item.name;
    chip.onclick = () => { searchScope = item.dbId; renderSearchScope(); doSearch(); };
    wrap.appendChild(chip);
  });
}

function doSearch(){
  const kw = $("searchInput").value.trim();
  const wrap = $("searchResults");
  wrap.innerHTML = "";

  if (!kw) {
    wrap.innerHTML = '<div class="big-empty"><div class="hand">输入关键词开始搜索</div><div>会同时匹配题干和答案</div></div>';
    return;
  }

  const lowerKw = kw.toLowerCase();
  let pool = [];
  DB_LIST.forEach(item => {
    if (searchScope !== "all" && searchScope !== item.dbId) return;
    pool = pool.concat(dbData[item.dbId].questions);
  });

  const matches = pool.filter(q =>
    q.title.toLowerCase().includes(lowerKw) ||
    q.answer.toLowerCase().includes(lowerKw)
  );

  if (!matches.length) {
    wrap.innerHTML = '<div class="big-empty"><div class="hand">没有找到匹配的题目</div><div>换个关键词试试</div></div>';
    return;
  }

  const summary = document.createElement("div");
  summary.style.cssText = "font-size:13px;color:var(--ink-soft);margin-bottom:10px";
  summary.textContent = `找到 ${matches.length} 道题`;
  wrap.appendChild(summary);

  matches.forEach((q, idx) => {
    const dbInfo = DB_LIST.find(x => x.dbId === q.dbId);
    const card = document.createElement("div");
    card.className = "paper-card sketch browse-q";
    card.innerHTML = `
      <div class="q-tags">
        <span class="qtag d">${dbInfo.name}</span>
        <span class="qtag t">${q.type}</span>
        <span class="qtag c">${q.chapter}</span>
        ${q.review > 0 ? '<span class="qtag done">已背 ' + q.review + ' 次</span>' : ''}
      </div>
      <div class="browse-title">${idx + 1}. ${q.title}</div>
      <div class="browse-answer">${q.answer}</div>
      <button class="btn small primary browse-toggle">展开答案</button>
    `;
    const answerEl = card.querySelector(".browse-answer");
    const btn = card.querySelector(".browse-toggle");
    btn.onclick = () => {
      const show = answerEl.classList.toggle("show");
      btn.textContent = show ? "收起答案" : "展开答案";
    };
    wrap.appendChild(card);
  });
}

// 搜索输入防抖
let searchTimer = null;
document.addEventListener("input", e => {
  if (e.target.id === "searchInput") {
    clearTimeout(searchTimer);
    searchTimer = setTimeout(doSearch, 200);
  }
});

// 点击 tab 时初始化视图
document.querySelectorAll(".tab").forEach(t => {
  const orig = t.onclick;
  t.onclick = () => {
    if (orig) orig();
    if (t.dataset.view === "browse") renderBrowse();
    if (t.dataset.view === "search") { renderSearchScope(); doSearch(); }
    if (t.dataset.view === "progress") renderProgress();
  };
});

loadAllDb();
</script>
</body>
</html>
